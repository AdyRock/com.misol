<header class="homey-header">
    <h1 class="homey-title" data-i18n="gatewayPair.title">
        <!-- This will be filled with the translated string with key 'gatewayPair.title'. -->
    </h1>
    <p><strong>Detected gateways</strong></p>
    <p class="homey-text-small">If your gateway is listed below, you can usually press Continue.</p>
    <ul id="detected_gateways"></ul>
    <p><button class="homey-button-secondary-shadow" id="refresh_detected">Refresh detected gateways</button></p>
</header>

<fieldset class="homey-form-fieldset">
    <legend class="homey-form-legend"><span data-i18n="gatewayPair.intro"></span></legend>

    <div class="homey-form-group">
        <label class="homey-form-label" for="ip_address"><span data-i18n="gatewayPair.ipAddress"></span></label>
        <input class="homey-form-input" id="ip_address" type="text" placeholder="192.168.1.100" />
    </div>

    <p><button class="homey-button-secondary-shadow" id="configure"><span data-i18n="gatewayPair.configure"></span></button></p>
    <p class="homey-text-small" data-i18n="gatewayPair.configureHint"></p>
    <p id="status"></p>

</fieldset>

<script type="text/javascript">
    var configureButton = document.getElementById('configure');
    var refreshButton = document.getElementById('refresh_detected');
    var ipInput = document.getElementById('ip_address');
    var statusElement = document.getElementById('status');
    var detectedGatewaysList = document.getElementById('detected_gateways');

    function escapeHtml(value)
    {
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function renderDetectedGateways(gateways)
    {
        if (!Array.isArray(gateways) || gateways.length === 0)
        {
            detectedGatewaysList.innerHTML = '<li>No gateways detected yet.</li>';
            return;
        }

        detectedGatewaysList.innerHTML = gateways.map(function(gateway)
        {
            var stationType = gateway.stationType ? String(gateway.stationType) : 'Unknown station type';
            var id = gateway.id ? String(gateway.id) : '-';
            var ip = gateway.sourceIP ? String(gateway.sourceIP) : '';
            var text = stationType + ' (' + id + ')';
            if (ip)
            {
                text += ' - ' + ip;
            }

            return '<li>' + escapeHtml(text) + '</li>';
        }).join('');
    }

    function refreshDetectedGateways()
    {
        refreshButton.classList.add('is-loading');
        refreshButton.disabled = true;

        Homey.emit('get_detected_gateways', {}, function(err, gateways)
        {
            refreshButton.classList.remove('is-loading');
            refreshButton.disabled = false;

            if (err)
            {
                detectedGatewaysList.innerHTML = '<li>Could not load detected gateways.</li>';
                return;
            }

            renderDetectedGateways(gateways);
        });
    }

    configureButton.addEventListener('click', function(e)
    {
        var ipAddress = ipInput.value.trim();
        if (!ipAddress)
        {
            Homey.alert(Homey.__('gatewayPair.enterIP'));
            return;
        }

        configureButton.classList.add('is-loading');
        configureButton.disabled = true;
        statusElement.textContent = Homey.__('gatewayPair.waitingForData');

        Homey.emit('configure_gateway', { ipAddress: ipAddress }, function(err, result)
        {
            configureButton.classList.remove('is-loading');
            configureButton.disabled = false;

            if (err)
            {
                statusElement.textContent = '';
                Homey.alert((err && err.message) ? err.message : err, 'error');
            }
            // On success the driver moves on to the next view itself via session.nextView()
        });
    });

    refreshButton.addEventListener('click', function(e)
    {
        refreshDetectedGateways();
    });

    refreshDetectedGateways();
</script>
